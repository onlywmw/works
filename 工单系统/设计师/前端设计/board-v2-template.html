<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta http-equiv="refresh" content="60"/>
<title>MOV 工单全局看板</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>

    darkMode: "class",
    theme: { extend: {
      colors: {
        "primary-container": "#2563eb", "surface-tint": "#0053db", "tertiary": "#943700",
        "surface-variant": "#e1e2ed", "inverse-primary": "#b4c5ff", "surface-container-high": "#e7e7f3",
        "error-container": "#ffdad6", "on-tertiary": "#ffffff", "on-tertiary-container": "#ffede6",
        "error": "#ba1a1a", "secondary": "#495c95", "on-secondary": "#ffffff",
        "on-secondary-fixed": "#00174b", "secondary-fixed-dim": "#b4c5ff", "surface-bright": "#faf8ff",
        "surface-container": "#ededf9", "on-surface": "#191b23", "primary-fixed": "#dbe1ff",
        "surface-container-highest": "#e1e2ed", "on-error-container": "#93000a", "inverse-surface": "#2e3039",
        "on-primary-container": "#eeefff", "tertiary-fixed": "#ffdbcd", "on-tertiary-fixed-variant": "#7d2d00",
        "background": "#faf8ff", "surface-container-lowest": "#ffffff", "on-tertiary-fixed": "#360f00",
        "on-primary-fixed-variant": "#003ea8", "on-secondary-container": "#394c84", "outline-variant": "#c3c6d7",
        "outline": "#737686", "on-error": "#ffffff", "surface": "#faf8ff", "on-surface-variant": "#434655",
        "on-background": "#191b23", "tertiary-container": "#bc4800", "surface-dim": "#d9d9e5",
        "tertiary-fixed-dim": "#ffb596", "secondary-fixed": "#dbe1ff", "primary-fixed-dim": "#b4c5ff",
        "surface-container-low": "#f3f3fe", "inverse-on-surface": "#f0f0fb", "on-secondary-fixed-variant": "#31447b",
        "primary": "#004ac6", "on-primary-fixed": "#00174b", "secondary-container": "#acbfff"
      },
      borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
      spacing: { sm: "8px", base: "8px", "container-max": "1200px", xl: "32px", gutter: "20px", lg: "24px", xs: "4px", md: "16px" },

<style>
  body { font-family: 'Inter', sans-serif; background-color: #f9fafb; color: #191b23; }
  .grid-bg { background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 16px 16px; }
  .table-row-expanded { background-color: #f3f3fe; }
  .fil-btn{font-size:11px;color:#737686;margin-left:2px;border:1px solid #c3c6d7;border-radius:3px;padding:0 4px;cursor:pointer;background:#fff}
  .fil-btn.active{background:#dbe1ff;color:#004ac6;border-color:#004ac6}
  .cond-row{display:flex;gap:6px;align-items:center;margin:6px 0}
  .cond-row select,.cond-row input{font-size:12px;padding:3px 5px;border:1px solid #c3c6d7;border-radius:4px;background:#fff}
  .cond-del{color:#ba1a1a;cursor:pointer;font-size:12px}
  .th-resizer{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize}
  th{position:relative}
  .sort-arrow{font-size:10px;color:#737686;margin-left:2px}
  .sort-arrow.on{color:#004ac6}
  .fil-label{display:flex;align-items:center;gap:4px;padding:2px 4px;font-size:12px;cursor:pointer}
  .fil-label:hover{background:#e7e7f3}
  .overdue-row td { background-color: #fef2f2; }
  @keyframes flashFocus { 0% { background: #dbe1ff; } 100% { background: transparent; } }
  .focus-flash td { animation: flashFocus 2s ease-out; }
</style>
</head>
<body class="bg-surface text-on-surface antialiased grid-bg">
<nav class="fixed top-0 w-full z-50 flex justify-between items-center px-lg h-10 bg-surface border-b border-outline-variant">
  <div class="flex items-center gap-md">
    <span class="font-h2 text-h2 font-bold text-primary">MOV 工单看板</span>
    <div class="flex gap-sm ml-lg">
      <button class="font-label-md text-label-md text-primary border-b-2 border-primary pb-1">全局视图</button>
      <button class="font-label-md text-label-md text-on-surface-variant" disabled>分析</button>
      <button class="font-label-md text-label-md text-on-surface-variant" disabled>团队</button>
      <button class="font-label-md text-label-md text-on-surface-variant" disabled>设置</button>
    </div>
  </div>
  <div class="flex items-center gap-sm">
    <span class="font-label-xs text-label-xs text-on-surface-variant px-2 py-1 rounded-full border border-outline-variant" id="sha-chip">E1 真相 · E4 只投影</span>
  </div>
</nav>
<div class="max-w-[1200px] mx-auto mt-12 px-md pb-xl">
    
  <section class="grid grid-cols-2 md:grid-cols-6 gap-md mb-lg" id="summary-cards"></section>
  <div class="flex gap-lg">
    <main class="flex-1">
      <section class="mb-lg">
        <h2 class="font-h3 text-h3 mb-sm flex items-center gap-xs"><span class="material-symbols-outlined text-red-600">priority_high</span> 当前重点（Top 5）</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-md" id="urgent-box"></div>
      </section>
      <div class="flex items-center gap-sm mb-sm text-[13px]">
  <label class="text-on-surface-variant">单号</label>
  <select id="sel-no" class="text-[12px] px-1.5 py-1 border border-outline-variant rounded bg-surface w-[148px]" onchange="applyF()"><option value="">全部</option></select>
  <label class="text-on-surface-variant ml-2">P</label>
  <select id="sel-pri" class="text-[12px] px-1.5 py-1 border border-outline-variant rounded bg-surface w-[148px]" onchange="applyF()"><option value="">全部</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option><option>未排</option></select>
  <span class="text-[11px] text-on-surface-variant ml-2" id="filter-summary"></span>
</div><section class="bg-surface-container-lowest border border-outline-variant rounded overflow-hidden shadow-sm">
        <table class="w-full text-left border-collapse">
          <thead class="bg-surface-container-low border-b border-outline-variant">
            <tr class="whitespace-nowrap">
              <th class="py-sm px-md font-label-xs text-label-xs text-on-surface-variant uppercase w-10">#</th>
              <th class="py-sm px-md font-label-xs text-label-xs text-on-surface-variant uppercase w-24">单号</th>
              <th class="py-sm px-md font-label-xs text-label-xs text-on-surface-variant uppercase w-14">P</th>
              <th class="py-sm px-md font-label-xs text-label-xs text-on-surface-variant uppercase">标题</th>
              <th class="py-sm px-md font-label-xs text-label-xs text-on-surface-variant uppercase w-32">状态</th>
              <th class="py-sm px-md font-label-xs text-label-xs text-on-surface-variant uppercase">卡点 / 下一步</th>
            </tr>            </tr>
          </thead>
          <tbody class="font-body-sm text-body-sm" id="main-table-body"></tbody>
        </table>
<div id="smart-pop" class="hidden fixed z-50 bg-surface-container-lowest border border-outline-variant rounded shadow-lg p-sm" style="min-width:260px;max-height:70vh;overflow:auto"></div>
<div id="filter-pop" class="hidden fixed z-50 bg-surface-container-lowest border border-outline-variant rounded shadow-lg p-sm w-56" style="min-width:180px"></div>
      </section>
    </main>
  </div>
  <section class="mt-xl border-t border-outline-variant pt-md">
    <div class="flex justify-between items-center mb-sm cursor-pointer hover:bg-surface-container-lowest p-xs rounded transition-colors" id="toggle-on-hold">
      <h3 class="font-h3 text-h3 flex items-center gap-xs text-on-surface-variant"><span class="material-symbols-outlined">pause_circle</span> 挂账待审池</h3>
      <button class="text-primary font-label-md text-label-md hover:underline" id="expand-hold">展开全部</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-5 gap-sm opacity-60" id="hold-box"></div>
  </section>
</div>

</html>
