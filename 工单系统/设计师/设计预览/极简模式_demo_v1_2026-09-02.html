<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MOV 极简模式 · 对话优先主页 demo v1</title>
<style>
:root{
  --primary:#0E7C5B; --primary-strong:#0A6649; --primary-tint:#E3F3ED;
  --s0:#FFFFFF; --s1:#F5F6F7; --s2:#EBECEE; --s3:#DFE1E4;
  --text1:#1A1C1E; --text2:#61666C; --text3:#9BA1A7;
  --line:#E5E7E9; --ok:#16A34A; --warn:#D97706; --danger:#DC2626;
  --scrim:rgba(15,18,20,.55);
}
[data-theme="dark"]{
  --primary:#34C79A; --primary-strong:#2BB38A; --primary-tint:#123B2F;
  --s0:#121417; --s1:#1A1D20; --s2:#23262A; --s3:#2E3237;
  --text1:#E8EAEC; --text2:#9BA1A7; --text3:#6B7076;
  --line:#2A2E33;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--s1);color:var(--text1);height:100vh;overflow:hidden;transition:background .4s}
.frame{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--s0);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.15)}
/* ===== ① 极简主页 ===== */
.home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .5s,transform .5s,visibility .5s;background:var(--s0);z-index:5}
.home.hidden{opacity:0;transform:scale(1.12);visibility:hidden;pointer-events:none}
.logo-wrap{width:220px;height:220px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .35s;border-radius:32px}
.logo-wrap:active{transform:scale(.94)}
.logo-wrap.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(0,0,0,0))}50%{transform:scale(1.06);filter:drop-shadow(0 0 30px var(--primary-tint))}}
.logo{width:100%;height:100%}
.hint{color:var(--text2);font-size:14px;text-align:center;line-height:1.6}
.hint b{color:var(--primary)}
/* 双通道输入 */
.input-zone{width:86%;display:flex;gap:10px;align-items:center;position:absolute;bottom:56px}
.mic-btn{width:56px;height:56px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:24px;cursor:pointer;flex:none;transition:background .3s,transform .2s;display:flex;align-items:center;justify-content:center}
.mic-btn.listening{background:var(--danger);animation:pulse .9s ease-in-out infinite}
.mic-btn.dim{background:var(--s3);color:var(--text3);cursor:not-allowed}
.text-input{flex:1;height:56px;border:2px solid var(--line);border-radius:28px;padding:0 20px;font-size:16px;background:var(--s1);color:var(--text1);outline:none;transition:border-color .3s,box-shadow .3s}
.text-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-tint)}
.send-btn{height:56px;padding:0 22px;border-radius:28px;border:none;background:var(--primary);color:#fff;font-size:15px;cursor:pointer;font-weight:600}
echo{color:var(--primary);font-style:normal}
/* logo 上方品牌语 */
.tagline{position:absolute;top:8vh;font-size:12px;letter-spacing:.35em;color:var(--text3)}
/* ===== 结果页 ===== */
.result{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(24px);transition:all .5s;visibility:hidden;z-index:10;background:var(--s0)}
.result.show{opacity:1;transform:none;visibility:visible}
.result-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.back-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--s2);cursor:pointer;font-size:17px;color:var(--text1)}
.result-title{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-badge{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 10px;flex:none}
.result-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
/* 商家卡片 */
.offer{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:rise .45s ease both}
.offer:nth-child(2){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.offer-img{height:180px;background:linear-gradient(135deg,var(--primary-tint),var(--s2));display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.offer-img .src-tag{position:absolute;right:10px;bottom:10px;font-size:10px;background:rgba(0,0,0,.45);color:#fff;padding:2px 8px;border-radius:4px}
.offer-body{padding:14px 16px}
.offer-name{font-size:17px;font-weight:700}
.offer-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.stars{color:var(--warn);font-size:13px}
.sales{color:var(--text3);font-size:12px}
.offer-params{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.param{font-size:12px;background:var(--s2);border-radius:8px;padding:5px 10px;color:var(--text2)}
.offer-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.price{font-size:22px;font-weight:800;color:var(--danger)}
.price small{font-size:12px;font-weight:400;color:var(--text2)}
.pay-btn{border:none;border-radius:24px;padding:12px 26px;font-size:15px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff}
.pay-btn:active{transform:scale(.96)}
.pay-btn.disabled{background:var(--s3);color:var(--text3);cursor:not-allowed}
/* 用户气泡 */
.user-bubble{align-self:flex-end;max-width:78%;background:var(--primary-tint);color:var(--text1);padding:10px 16px;border-radius:16px 16px 4px 16px;font-size:15px}
.ai-quote{font-size:13px;color:var(--text3);padding:0 4px}
/* 底部继续对话 */
.result-input{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--s0)}
.result-input .text-input{height:48px;border-radius:24px}
.result-input .send-btn{height:48px;padding:0 18px;border-radius:24px}
/* 转场遮罩 */
.screen-flash{position:absolute;inset:0;background:var(--s0);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.screen-flash.on{opacity:1}
.demo-note{position:fixed;left:10px;bottom:8px;font-size:10px;color:var(--text3);z-index:99;background:var(--s0);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="frame">
  <!-- 演示说明 -->
  <div class="demo-note">MOV 极简模式 demo v1 · 设计预览（非产品）｜ Hero 视觉单元（默认=品牌竖眼，可注入图案/动画/特效/文字）——试试点 Hero/麦克风，或输入「我要吃辣椒炒肉」</div>

  <!-- ① 极简主页 -->
  <div class="home" id="home">
    <div class="tagline">MOVE  ·  JUST SPEAK</div>
    <div class="logo-wrap" id="logoWrap" title="点击开始对话">
      <svg class="logo" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0E7C5B"/><stop offset="1" stop-color="#0A6649"/>
          </linearGradient>
        </defs>
        <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#g1)"/>
        <path d="M38 24 Q42 44 42 50 Q42 62 34 74 Q48 64 48 50 Q48 36 38 24 Z" fill="#fff" opacity=".92"/>
        <path d="M56 24 Q62 42 62 50 Q62 62 54 74 Q68 64 68 50 Q68 36 56 24 Z" fill="#fff" opacity=".92"/>
        <circle cx="50" cy="50" r="6" fill="none" stroke="#fff" stroke-width="2.6"/>
        <circle cx="50" cy="50" r="2.2" fill="#fff"/>
      </svg>
    </div>
    <div class="hint" id="homeHint">点击 <b>logo</b> 直接说，或输入一句话<br><echo>「我要吃辣椒炒肉」</echo> 试试</div>
    <div class="input-zone">
      <button class="mic-btn" id="micBtn" title="语音输入">🎤</button>
      <input class="text-input" id="mainInput" placeholder="说出或输入你的需求…">
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
  </div>

  <!-- ② 结果页 -->
  <div class="result" id="result">
    <div class="result-top">
      <button class="back-btn" id="backBtn">←</button>
      <div class="result-title">为你找到 · 辣椒炒肉</div>
      <span class="demo-badge">DEMO 数据</span>
    </div>
    <div class="result-body" id="resultBody">
      <div class="user-bubble" id="userBubble">我要吃辣椒炒肉</div>
      <div class="ai-quote">实时渲染 · 商家卡片（模板受控渲染，LLM 只填数据）</div>
      <div class="offer">
        <div class="offer-img">🍛<span class="src-tag">图源占位</span></div>
        <div class="offer-body">
          <div class="offer-name">湘味小炒 · 辣椒炒肉</div>
          <div class="offer-meta"><span class="stars">★★★★☆</span><span class="sales">月售 286</span><span class="sales">· 30 分钟达</span></div>
          <div class="offer-params"><span class="param">辣度 · 中辣</span><span class="param">份量 · 1 人份</span><span class="param">配送费 ¥3</span></div>
          <div class="offer-bottom">
            <div class="price">¥32<small> 起</small></div>
            <button class="pay-btn disabled" id="payBtn">付款 · 即将开放</button>
          </div>
        </div>
      </div>
    </div>
    <div class="result-input">
      <input class="text-input" id="chatInput" placeholder="继续对话：「换一家」…">
      <button class="send-btn" id="chatSend">发送</button>
    </div>
  </div>

  <div class="screen-flash" id="flash"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const home=$('home'),result=$('result'),flash=$('flash');
let listening=false, speechTimer=null;

/* ① logo 点击 = 模拟语音（demo：当前端无 ASR，模拟「听写」） */
$('logoWrap').addEventListener('click',()=>{
  if(listening) return;
  listening=true; $('logoWrap').classList.add('pulse');
  $('micBtn').classList.add('listening');
  $('homeHint').innerHTML='🎙 正在听…（demo 模拟）';
  speechTimer=setTimeout(()=>{ simulateSpeech(); },1200);
});
$('micBtn').addEventListener('click',()=>{
  if(listening) return;
  listening=true; $('micBtn').classList.add('listening');
  $('homeHint').innerHTML='🎙 正在听…（demo 模拟）';
  speechTimer=setTimeout(()=>{ simulateSpeech(); },1200);
});
function simulateSpeech(){
  const phrase='我要吃辣椒炒肉'; let i=0;
  $('homeHint').innerHTML='收到：<echo></echo>';
  const t=setInterval(()=>{
    i++;
    $('homeHint').querySelector('echo').textContent=phrase.slice(0,i);
    if(i>=phrase.length){clearInterval(t); listening=false;
      $('logoWrap').classList.remove('pulse'); $('micBtn').classList.remove('listening');
      finishQuery(phrase);}
  },110);
}

/* ② 输入提交 */
function submitText(){
  const v=$('mainInput').value.trim();
  if(!v) return;
  finishQuery(v);
}
$('sendBtn').addEventListener('click',submitText);
$('mainInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitText();});

/* ③ 转场：主页隐去 → 结果页浮出（实时渲染沉浸） */
function finishQuery(text){
  $('userBubble').textContent=text;
  flash.classList.add('on');
  setTimeout(()=>{ home.classList.add('hidden'); },180);
  setTimeout(()=>{ result.classList.add('show'); flash.classList.remove('on'); },520);
}

/* ④ 返回主页 */
$('backBtn').addEventListener('click',()=>{
  flash.classList.add('on');
  setTimeout(()=>{ result.classList.remove('show'); home.classList.remove('hidden'); },180);
  setTimeout(()=>{ flash.classList.remove('on'); },520);
});

/* ⑤ 结果页继续对话（demo：换一家 = 卡片切换） */
function chatSend(){
  const v=$('chatInput').value.trim();
  if(!v) return;
  if(v.includes('换')){
    const img=$('resultBody').querySelector('.offer-img');
    img.firstChild.textContent='🥘';
    img.style.background='linear-gradient(135deg,#FDEBD0,#F5F6F7)';
    $('resultBody').querySelector('.offer-name').textContent='赣菜小馆 · 辣椒炒肉';
    $('resultBody').querySelector('.sales').textContent='月售 512 · 25 分钟达';
    img.style.background='linear-gradient(135deg,#FDEBD0,#F5F6F7)';
    const p=$('resultBody').querySelector('.price');
    p.innerHTML='¥28<small> 起</small>';
    $('userBubble').textContent='换一家';
  } else {
    $('userBubble').textContent=v;
  }
  $('chatInput').value='';
}
$('chatSend').addEventListener('click',chatSend);
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')chatSend();});
$('payBtn').addEventListener('click',()=>{$('payBtn').textContent='即将开放（商业期）';});
</script>
</body>
</html>
